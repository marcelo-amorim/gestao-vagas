name: Gestao De Vagas


on:
    push:
        branches: [main]

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4
            - name: Setup Java
              uses: actions/setup-java@v6
              with:
                distribution: temurin
                java-version: 17
            - name: Build project
              run: mvn clean install
            - name: Log in to Docker Hub
              uses: docker/login-action@v4
              with:
                username: ${{ secrets.DOCKER_USERNAME }}
                password: ${{ secrets.DOCKER_TOKEN }}

            - name: Build Docker image
              run: docker build -t marcelittle/gestao_vagas .
            - name: Publish image
              run: docker push marcelittle/gestao_vagas
    deploy:
        needs: build
        runs-on: self-hosted
        steps:
            - name: Pull image docker hub
              run: docker pull marcelittle/gestao_vagas:latest
            - name: Remove existing container
              run: docker rm -f gestao-vagas
            - name: Run docker container
              run: docker run -d -p 8080:8080 -e DATABASE_URL=${{secrets.DATABASE_URL}} -e DATABASE_PASSWORD='${{secrets.DATABASE_PASSWORD}}' -e DATABASE_USERNAME=${{secrets.DATABASE_USERNAME}} --name gestao-vagas marcelittle/gestao_vagas
